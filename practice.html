<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <thead>
        <tr>
            <th>Day</th>
            <th>Opening</th>
            <th>Closing</th>
        </tr>
        </thead>

        <tbody>
        <tr>
            <td>Sunday</td>
            <td>10:00 AM</td>
            <td>6:00 PM</td>
        </tr>

        <tr>
            <td>Monday-friday</td>
            <td>6:00 AM</td>
            <td>9:00 PM</td>
        </tr>

        <tr>
            <td>Saturday</td>
            <td colspan="2">Closed</td>
            
        </tr>
        </tbody>

        <tr>
            <th scope="row">Sunday</th>
            <td>6:00 am</td>
            <td>9:00 pm</td>
        </tr>
    </table>
</body>
</html>
